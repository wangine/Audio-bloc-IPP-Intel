name: MUSIC ClockFollow C1 contracts
on:
  push:
    branches: [chatgpt/music-clockfollow-c1-20261015]
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check delivery script syntax without executing
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($name in @('Build-C1.ps1','Build-Kernel.ps1')) {
            $tokens=$null; $errors=$null
            $path=(Resolve-Path (Join-Path 'Drivers/EntropyMusicRenderV2/tools' $name)).Path
            $null=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parse failure: $name" }
          }
          Write-Host 'C1 PowerShell syntax PASS. No kernel build or deployment executed.'
      - name: Configure isolated clock contracts
        run: cmake -S Drivers/EntropyMusicRenderV2/clockfollow-tests -B build-clockfollow -DCMAKE_BUILD_TYPE=Release
      - name: Build clock contracts
        run: cmake --build build-clockfollow --config Release --parallel 2
      - name: Run Windows model only
        if: runner.os == 'Windows'
        run: |
          .\build-clockfollow\Release\EntropyClockFollowContracts.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in @('Model','Bridge','KernelBinding','Inbox')) {
            & ".\build-clockfollow\Release\ClockFollowLegacy$name.exe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Run Linux model only
        if: runner.os == 'Linux'
        run: ./build-clockfollow/EntropyClockFollowContracts
